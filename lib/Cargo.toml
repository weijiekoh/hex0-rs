[package]
name = "hex0-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-sol-types = { workspace = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0.200", default-features = false, features = ["derive"] }
sha2 = "0.10.9"
hex = "0.4.3"
# The emulator executes legacy integer encodings only; omit the other tables.
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "no_vex", "no_evex", "no_xop", "no_d3now"] }
